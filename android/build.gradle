buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Specify the version of the Android Gradle Plugin
        classpath("com.android.tools.build:gradle:7.4.0")  // Update this to the version that matches your Gradle version

        // Specify the version for react-native-gradle-plugin
        classpath("com.facebook.react:react-native-gradle-plugin:+") // Using + to always use the latest version, specify a version if needed

        // Use the Kotlin version defined in the ext block
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// Apply the React Native root project plugin
apply plugin: "com.facebook.react.rootproject"
